<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Keyword Brainstorm · Documentary Acquisitions Ledger</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#2F4538" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#EDE6D6;
  --card:#F7F2E7;
  --ink:#221F1A;
  --ink-faded:#6B6558;
  --green:#2F4538;
  --red:#A13D2B;
  --border:rgba(34,31,26,0.16);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:transparent;}
body{ font-family:'Lora', serif; color:var(--ink); background:var(--paper); }
#root{
  min-height:100%;
  background:var(--paper);
  background-image:linear-gradient(var(--border) 1px, transparent 1px);
  background-size:100% 44px;
  padding:28px 20px 60px;
}
.wrap{ max-width:1000px; margin:0 auto; }

.topbar{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--ink-faded); margin:0 0 4px;
}
.nav-link{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em;
  text-transform:uppercase; color:var(--ink-faded); text-decoration:none;
  border-bottom:1px solid var(--border); white-space:nowrap;
}
.nav-link:hover{ color:var(--ink); border-color:var(--ink); }
h1{ font-family:'Special Elite', monospace; font-weight:400; font-size:24px; margin:0 0 16px; letter-spacing:0.01em; }

.layout{ display:flex; gap:18px; align-items:flex-start; }
.sidebar{ width:230px; flex-shrink:0; }
.chat{ flex:1; min-width:0; }

button{
  font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.03em;
  cursor:pointer; border-radius:4px; border:1px solid var(--border);
  background:var(--card); color:var(--ink); padding:8px 14px;
}
button:hover:not(:disabled){ border-color:var(--ink); }
button:disabled{ opacity:0.5; cursor:default; }
.btn-primary{ background:var(--green); color:var(--card); border-color:var(--green); }
.btn-primary:hover:not(:disabled){ filter:brightness(1.08); }
.btn-block{ width:100%; }
.btn-quiet{ background:transparent; border-color:transparent; color:var(--ink-faded); padding:4px 6px; font-size:11px; }
.btn-quiet:hover:not(:disabled){ color:var(--ink); border-color:transparent; }

.session{
  display:flex; align-items:center; gap:6px;
  border:1px solid var(--border); border-radius:5px;
  padding:8px 10px; margin-top:8px; background:var(--card); cursor:pointer;
}
.session:hover{ border-color:var(--ink-faded); }
.session.active{ border-color:var(--green); }
.session .stitle{ font-family:'Lora', serif; font-size:13px; font-weight:500; line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.session .sdate{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--ink-faded); margin-top:3px; }
.session .sgrow{ flex:1; min-width:0; }
.sidebar-empty{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-faded); margin-top:10px; line-height:1.5; }

.panel{ background:var(--paper); border:1px solid var(--border); border-radius:6px; padding:0; display:flex; flex-direction:column; min-height:60vh; }
.chat-head{
  display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border); padding:12px 16px;
}
.chat-title{ font-family:'Special Elite', monospace; font-size:14px; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.stream{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
.msg{ animation:fadeInUp 0.2s ease both; }
.msg .who{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--ink-faded); margin-bottom:4px; }
.msg .body{ font-family:'Lora', serif; font-size:14.5px; line-height:1.55; white-space:pre-wrap; }
.msg.user .body{ background:var(--card); border:1px solid var(--border); border-radius:6px; padding:9px 12px; }

.chips{ margin-top:10px; border-left:2px solid var(--green); padding-left:12px; }
.chips-head{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase;
  letter-spacing:0.07em; color:var(--ink-faded); margin-bottom:8px; }
.sugg{ display:flex; align-items:flex-start; gap:10px; padding:6px 0; cursor:pointer; }
.sugg .box{ flex-shrink:0; width:15px; height:15px; margin-top:2px; border:1.5px solid var(--ink-faded);
  border-radius:3px; display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--card); }
.sugg.selected .box{ background:var(--green); border-color:var(--green); }
.sugg .term{ font-family:'Lora', serif; font-weight:600; font-size:14px; }
.sugg .cat{ font-family:'IBM Plex Mono', monospace; font-size:9px; text-transform:uppercase;
  letter-spacing:0.05em; color:var(--ink-faded); border:1px solid var(--border);
  border-radius:2px; padding:1px 5px; margin-left:7px; vertical-align:middle; }
.sugg .why{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-faded); margin-top:2px; }
.sugg.dupe{ cursor:default; opacity:0.5; }
.sugg.dupe .box{ border-style:dashed; }

.addbar{
  display:flex; align-items:center; gap:10px;
  border-top:1px solid var(--border); padding:10px 16px;
  font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-faded);
}
.addbar .spacer{ flex:1; }
.toast{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--green); }

.composer{ border-top:1px solid var(--border); padding:12px 16px; display:flex; gap:10px; align-items:flex-end; }
textarea{
  font-family:'Lora', serif; font-size:14px; color:var(--ink); background:var(--card);
  border:1px solid var(--border); border-radius:4px; padding:9px 11px;
  flex:1; resize:none; min-height:42px; max-height:160px; line-height:1.4;
}
.empty{
  font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-faded);
  text-align:center; padding:40px 16px; line-height:1.6; margin:auto;
}
.error-banner{
  background:var(--card); border:1px solid var(--red); color:var(--red); border-radius:6px;
  padding:10px 14px; font-family:'IBM Plex Mono', monospace; font-size:12px; margin:0 16px 12px;
}

@keyframes fadeInUp{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }

@media (max-width: 720px){
  h1{ font-size:20px; }
  .layout{ flex-direction:column; }
  .sidebar{ width:100%; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Same public Supabase credentials as the ledger — safe to expose client-side.
const SUPABASE_URL = 'https://fdbkdsracxomwyytfgob.supabase.co';
const SUPABASE_KEY = 'sb_publishable_w5izyYtgIXD-pQvjlkn4jg_DtGJq_7j';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORY_LABEL = {
  person:'person', place:'place', event:'event',
  organization:'org', alias:'alias', topic:'topic'
};
const norm = (s) => (s || '').trim().toLowerCase();

// Pull the human-readable text out of a message's content (string or block array).
function textOf(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    return content.filter(b => b && b.type === 'text').map(b => b.text).join('\n').trim();
  }
  return '';
}
// Collect propose_keywords tool calls in an assistant message.
function keywordCalls(content) {
  if (!Array.isArray(content)) return [];
  return content
    .filter(b => b && b.type === 'tool_use' && b.name === 'propose_keywords')
    .map(b => Array.isArray(b.input && b.input.keywords) ? b.input.keywords : [])
    .filter(list => list.length);
}
function shortDate(ts) {
  try { return new Date(ts).toLocaleDateString(undefined, { month:'short', day:'numeric' }); }
  catch { return ''; }
}

function App() {
  const [sessions, setSessions] = useState([]);
  const [currentId, setCurrentId] = useState(null);
  const [title, setTitle] = useState('New brainstorm');
  const [messages, setMessages] = useState([]);      // Anthropic-shaped history
  const [existing, setExisting] = useState(() => new Set());
  const [selected, setSelected] = useState(() => new Set());
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [promoting, setPromoting] = useState(false);
  const [error, setError] = useState(null);
  const [toast, setToast] = useState(null);
  const streamRef = useRef(null);

  const loadExisting = async () => {
    try {
      const { data, error } = await sb.from('arch_keywords').select('term');
      if (error) throw error;
      setExisting(new Set((data || []).map(r => norm(r.term))));
    } catch (e) { console.warn('existing keywords:', e.message); }
  };
  const loadSessions = async () => {
    try {
      const { data, error } = await sb.from('arch_brainstorms')
        .select('id,title,updated_at').eq('archived', false)
        .order('updated_at', { ascending:false });
      if (error) throw error;
      setSessions(data || []);
    } catch (e) { console.warn('sessions:', e.message); }
  };

  useEffect(() => { loadExisting(); loadSessions(); }, []);
  useEffect(() => {
    if (streamRef.current) streamRef.current.scrollTop = streamRef.current.scrollHeight;
  }, [messages, loading]);

  const newSession = () => {
    setCurrentId(null); setTitle('New brainstorm'); setMessages([]);
    setSelected(new Set()); setError(null); setToast(null); setInput('');
  };
  const openSession = async (id) => {
    setError(null); setToast(null); setSelected(new Set());
    try {
      const { data, error } = await sb.from('arch_brainstorms')
        .select('id,title,messages').eq('id', id).single();
      if (error) throw error;
      setCurrentId(data.id); setTitle(data.title || 'Untitled brainstorm');
      setMessages(Array.isArray(data.messages) ? data.messages : []);
      loadExisting();
    } catch (e) { setError("Couldn't open that conversation — " + e.message); }
  };
  const renameSession = async () => {
    const next = window.prompt('Rename this brainstorm:', title);
    if (next == null) return;
    const t = next.trim() || 'Untitled brainstorm';
    setTitle(t);
    if (currentId) {
      try { await sb.from('arch_brainstorms').update({ title:t }).eq('id', currentId); loadSessions(); }
      catch (e) { setError('Rename failed — ' + e.message); }
    }
  };
  const archiveSession = async (id, e) => {
    if (e) e.stopPropagation();
    if (!window.confirm('Remove this conversation from your list? (Promoted keywords stay in the tracker.)')) return;
    try {
      await sb.from('arch_brainstorms').update({ archived:true, updated_at:new Date().toISOString() }).eq('id', id);
      if (id === currentId) newSession();
      loadSessions();
    } catch (err) { setError('Remove failed — ' + err.message); }
  };

  const persist = async (msgs) => {
    try {
      if (!currentId) {
        const firstUser = msgs.find(m => m.role === 'user');
        const t = (textOf(firstUser && firstUser.content) || 'Untitled brainstorm').slice(0, 60);
        const { data, error } = await sb.from('arch_brainstorms')
          .insert({ title:t, messages:msgs }).select('id,title').single();
        if (error) throw error;
        setCurrentId(data.id); setTitle(data.title);
      } else {
        const { error } = await sb.from('arch_brainstorms')
          .update({ messages:msgs, updated_at:new Date().toISOString() }).eq('id', currentId);
        if (error) throw error;
      }
      loadSessions();
    } catch (e) { console.warn('save failed:', e.message); }
  };

  const send = async () => {
    const text = input.trim();
    if (!text || loading) return;
    setError(null); setToast(null);

    // If the previous assistant turn ended with tool calls, answer them (required
    // by the API) in the same user turn, then add the new text.
    let userContent = text;
    const last = messages[messages.length - 1];
    if (last && last.role === 'assistant' && Array.isArray(last.content)) {
      const toolUses = last.content.filter(b => b && b.type === 'tool_use');
      if (toolUses.length) {
        userContent = toolUses.map(tu => ({
          type:'tool_result', tool_use_id: tu.id, content:'Suggestions were shown to the user.'
        }));
        userContent.push({ type:'text', text });
      }
    }
    const next = [...messages, { role:'user', content:userContent }];
    setMessages(next); setInput(''); setLoading(true);
    try {
      const { data, error } = await sb.functions.invoke('brainstorm-keywords', {
        body: { messages: next, existing: Array.from(existing) }
      });
      if (error) {
        let msg = error.message;
        try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (_) {}
        throw new Error(msg);
      }
      const assistant = { role: data.role || 'assistant', content: data.content || [] };
      const after = [...next, assistant];
      setMessages(after);
      await persist(after);
    } catch (e) {
      setError(e.message);
      setMessages(messages); // roll back the optimistic user turn
    } finally { setLoading(false); }
  };

  const toggle = (term) => {
    if (existing.has(norm(term))) return;
    setSelected(prev => { const n = new Set(prev); n.has(term) ? n.delete(term) : n.add(term); return n; });
  };
  const promote = async () => {
    const picks = Array.from(selected).filter(t => !existing.has(norm(t)));
    if (!picks.length) return;
    setPromoting(true); setError(null); setToast(null);
    try {
      const rows = picks.map(term => ({ term, source:'brainstorm: ' + title, status:'unsearched' }));
      const { error } = await sb.from('arch_keywords').insert(rows);
      if (error) throw error;
      setToast('Added ' + picks.length + ' to the tracker.');
      setSelected(new Set());
      await loadExisting();
    } catch (e) { setError("Couldn't add those — " + e.message); }
    finally { setPromoting(false); }
  };

  const selectableSelected = Array.from(selected).filter(t => !existing.has(norm(t)));

  return (
    <div className="wrap">
      <div className="topbar">
        <div className="eyebrow">Personal archive · keyword workshop</div>
        <a className="nav-link" href="./index.html">← Ledger</a>
      </div>
      <h1>Keyword Brainstorm</h1>

      <div className="layout">
        <div className="sidebar">
          <button className="btn-primary btn-block" onClick={newSession}>＋ New brainstorm</button>
          {sessions.length === 0 && (
            <div className="sidebar-empty">No saved brainstorms yet. Start one — it saves automatically as you go.</div>
          )}
          {sessions.map(s => (
            <div key={s.id} className={"session" + (s.id === currentId ? " active" : "")} onClick={() => openSession(s.id)}>
              <div className="sgrow">
                <div className="stitle">{s.title || 'Untitled brainstorm'}</div>
                <div className="sdate">{shortDate(s.updated_at)}</div>
              </div>
              <button className="btn-quiet" title="Remove" onClick={(e) => archiveSession(s.id, e)}>✕</button>
            </div>
          ))}
        </div>

        <div className="chat">
          <div className="panel">
            <div className="chat-head">
              <div className="chat-title">{title}</div>
              <button className="btn-quiet" onClick={renameSession}>rename</button>
            </div>

            <div className="stream" ref={streamRef}>
              {messages.length === 0 && !loading && (
                <div className="empty">
                  Start a conversation. Try “Documentaries on the Rwandan genocide — what
                  should I search?” then refine: “more obscure,” “focus on the filmmakers,”
                  “anything in French.”<br/><br/>
                  Picks you select get sent to the ledger's keyword list.
                </div>
              )}

              {messages.map((m, i) => {
                const body = textOf(m.content);
                const calls = m.role === 'assistant' ? keywordCalls(m.content) : [];
                if (!body && calls.length === 0) return null;
                return (
                  <div key={i} className={"msg " + m.role}>
                    <div className="who">{m.role === 'user' ? 'You' : 'Claude'}</div>
                    {body && <div className="body">{body}</div>}
                    {calls.map((list, ci) => (
                      <div className="chips" key={ci}>
                        <div className="chips-head">Suggested terms — tap to select</div>
                        {list.map((k, ki) => {
                          const dupe = existing.has(norm(k.term));
                          const sel = selected.has(k.term);
                          return (
                            <div key={ki} className={"sugg" + (sel ? " selected" : "") + (dupe ? " dupe" : "")}
                                 onClick={() => toggle(k.term)}>
                              <div className="box">{sel ? '✓' : ''}</div>
                              <div>
                                <div className="term">
                                  {k.term}
                                  <span className="cat">{dupe ? 'tracked' : (CATEGORY_LABEL[k.category] || k.category)}</span>
                                </div>
                                {k.rationale && <div className="why">{k.rationale}</div>}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                );
              })}

              {loading && <div className="msg"><div className="who">Claude</div><div className="body" style={{color:'var(--ink-faded)'}}>Thinking…</div></div>}
            </div>

            {error && <div className="error-banner">{error}</div>}

            {(selectableSelected.length > 0 || toast) && (
              <div className="addbar">
                {toast && <span className="toast">{toast}</span>}
                {selectableSelected.length > 0 && <span>{selectableSelected.length} selected</span>}
                <div className="spacer" />
                {selectableSelected.length > 0 && (
                  <button className="btn-primary" onClick={promote} disabled={promoting}>
                    {promoting ? 'Adding…' : 'Add to keywords'}
                  </button>
                )}
              </div>
            )}

            <div className="composer">
              <textarea
                placeholder="Ask, refine, or steer the brainstorm…"
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
                rows={1}
              />
              <button className="btn-primary" onClick={send} disabled={loading || !input.trim()}>Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
